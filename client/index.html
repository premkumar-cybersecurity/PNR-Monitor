<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Simple PNR monitoring dashboard">
  <title>PNR Monitor</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <header class="hero">
      <div>
        <p class="eyebrow">PNR MONITOR</p>
        <h1>Track your PNR automatically.</h1>
        <p class="subtitle">Up to 10 PNRs · Hourly checks · Status history</p>
      </div>
      <div id="healthBadge" class="badge">Checking server...</div>
    </header>

    <section class="card">
      <div class="section-title">
        <div>
          <p class="eyebrow">NEW MONITOR</p>
          <h2>Add a PNR</h2>
        </div>
        <span id="countBadge" class="count">0 / 10</span>
      </div>

      <form id="pnrForm">
        <label>
          PNR number
          <input id="pnrNumber" inputmode="numeric" maxlength="10"
                 placeholder="10-digit PNR" autocomplete="off" required>
        </label>

        <label>
          Notification email
          <input id="email" type="email"
                 placeholder="you@example.com" autocomplete="email" required>
        </label>

        <button id="addButton" type="submit">Start monitoring</button>
      </form>

      <p id="message" class="message"></p>
    </section>

    <section class="card">
      <div class="section-title">
        <div>
          <p class="eyebrow">MONITORING</p>
          <h2>Your PNRs</h2>
        </div>
        <button id="refreshButton" class="secondary">Refresh</button>
      </div>

      <div id="pnrList" class="list">Loading...</div>
    </section>

    <footer>
      <span>PNR Monitor V1</span>
      <span>Hourly monitoring</span>
    </footer>
  </main>

  <script src="app.js"></script>
</body>
</html>
